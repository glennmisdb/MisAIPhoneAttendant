name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore src/MisAIPhoneAttendant/MisAIPhoneAttendant.csproj
      - run: dotnet build src/MisAIPhoneAttendant/MisAIPhoneAttendant.csproj --configuration Release --no-restore
